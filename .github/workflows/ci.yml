name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: Lint, tests, security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: python -m pip install --upgrade pip pytest bandit pyflakes

      - name: Syntax check (all modules)
        run: python -m py_compile $(git ls-files '*.py')

      - name: Lint (pyflakes)
        run: python -m pyflakes $(git ls-files '*.py')

      - name: Qt6 scoped-enum check
        run: python tools/check_qt6_enums.py

      - name: Unit tests (no QGIS required)
        run: python -m pytest -q tests

      - name: Security scan (bandit)
        run: python -m bandit -q -r . -x ./tests,./tools
