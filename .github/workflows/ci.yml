name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, tests, security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan Git history for secrets
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --log-opts=--all --redact --no-banner .

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install tools
        run: python -m pip install --upgrade pip pytest bandit pyflakes "pyproj>=3.7,<4" "shapely>=2.1,<3"

      - name: Syntax check (all modules)
        run: python -m py_compile $(git ls-files '*.py')

      - name: Lint (pyflakes)
        run: python -m pyflakes $(git ls-files '*.py')

      - name: Qt6 scoped-enum check
        run: python tools/check_qt6_enums.py

      - name: Unit tests (no QGIS required)
        run: python -m pytest -q tests --ignore=tests/test_grid_adapter.py

      - name: Security scan (bandit)
        run: python -m bandit -q -r . -x ./tests,./tools
